spring.application.name=JeevanHospital

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/jeevan_hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=Anubhav
spring.datasource.password=Admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' automatically creates tables or updates columns based on your Java Entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the STS Console console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.security.user.name=ANUBHAV
spring.security.user.password=ANUBHAV

