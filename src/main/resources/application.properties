spring.application.name=JeevanHospital

# ==========================================
# 1. MySQL Connection Settings
# ==========================================
# टीप: जर पोर्ट 3306 नसेल तर 3307 वापरून पहा. शेवटी createDatabaseIfNotExist जोडले आहे.
spring.datasource.url=jdbc:mysql://localhost:3306/jeevanhospital_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# !!! महत्वाचे: तुमचे अचूक MySQL क्रेडेंशियल्स इथे टाका (साधारणपणे username 'root' असतो) !!!
spring.datasource.username=Anubhav
spring.datasource.password=Admin

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. Hibernate / JPA Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# 3. JWT Custom Configuration Settings
# ==========================================
# टोकन जनरेशनसाठी लागणारी सिक्रेट की आणि वेळ
jeevanhospital.jwt.secret=9a4f94d8175b34e58b472e3a6c9d2f1e4a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d
jeevanhospital.jwt.expiration=86400000

# टीप: जुन्या spring.security.user.name ओळी इथून पूर्णपणे काढून टाकल्या आहेत!
